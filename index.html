<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyCommand & 날려드려</title>
<script>
  (function() {
    var ua = navigator.userAgent || navigator.vendor || window.opera || '';
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(ua)
                || (window.matchMedia && window.matchMedia('(max-width: 768px)').matches)
                || (window.innerWidth <= 768 && window.innerHeight <= 1024);
    
    var target = isMobile ? '/mobile.html' : '/pc.html';
    var query = window.location.search || '';
    var hash = window.location.hash || '';
    
    window.location.replace(target + query + hash);
  })();
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=/pc.html">
</noscript>
<style>
  body {
    background: #090e17;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #60a5fa; text-decoration: none; margin: 0 8px; font-weight: 700; }
  a:hover { text-decoration: underline; }
</style>
</head>

    </span>
  </p>
</body>
</html>
