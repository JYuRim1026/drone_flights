[build]
  publish = "drone_filght/frontend"

[[redirects]]
  from = "/pc"
  to = "/pc.html"
  status = 200

[[redirects]]
  from = "/mobile"
  to = "/mobile.html"
  status = 200

[[redirects]]
  from = "/camera"
  to = "/camera.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
